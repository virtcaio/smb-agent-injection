agencies:
  ag01:
    name: Procon-MG
    scope: Reclamações de consumo contra empresas que atuam em Minas Gerais, incluindo transportadoras, entregas e fornecedores
  ag02:
    name: Anatel
    scope: 'Serviços de telecomunicações: internet, telefone fixo e móvel, TV por assinatura'
  ag03:
    name: Banco Central
    scope: Bancos, financeiras e instituições de pagamento, incluindo maquininhas e processadoras de cartão
  ag04:
    name: consumidor.gov.br
    scope: Mediação online com empresas que aderiram à plataforma, para disputas de consumo em geral sem órgão específico
  ag05:
    name: ANPD
    scope: 'Proteção de dados pessoais: vazamentos, acesso indevido e pedidos de exclusão (LGPD)'
  ag06:
    name: Ouvidoria dos Correios
    scope: 'Serviços postais: SEDEX, encomendas perdidas e franquias dos Correios'
