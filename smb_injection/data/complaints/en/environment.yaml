agencies:
  ag01:
    name: Oregon DOJ Consumer Protection
    scope: Consumer complaints against businesses operating in Oregon, including carriers, delivery services and suppliers
  ag02:
    name: FCC
    scope: 'Telecommunications services: internet, landline and mobile phone, cable TV'
  ag03:
    name: CFPB
    scope: Banks, lenders and payment companies, including card processors and merchant payment services
  ag04:
    name: FTC
    scope: Consumer complaints about deceptive or unfair business practices not covered by a specific agency, such as supplier refund disputes
  ag05:
    name: State Data Privacy Office
    scope: 'Personal data protection: breaches, unauthorized access and deletion requests'
  ag06:
    name: USPS Office of Inspector General
    scope: 'Postal services: priority parcels, lost packages and postal franchises'
