[project]
name = "smb-agent-injection"
version = "0.1.0"
description = "Indirect prompt injection in small-business agent workflows (PT/EN): model vs. architecture vs. detector"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.287",
    "inspect-evals[agentdojo]>=0.27.0",
    "anthropic",
    "pyyaml",
    "numpy",
    "pandas",
    "scipy",
    "prompt-armor==0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smb_injection"]
